    <style>
        :root {
            --bg-main: #f8f9fa;
            --bg-section: #ffffff;
            --bg-bar: #e9ecef;
            --bg-bar-hover: #dee2e6;
            --text-main: #2b3035;
            --text-muted: #6c757d;
            --accent: #c85815; 
            --nav-bg: rgba(255, 255, 255, 0.95); /* Leggermente trasparente per un bell'effetto scroll */
        }

        body {
            font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
        }

        /* LOGO INIZIALE (HERO) - Svincolato e Grande */
        .hero-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 4rem 2rem 2rem 2rem;
            background-color: var(--bg-main);
        }

        .hero-logo img {
            height: 140px; /* Dimensioni generose */
            max-width: 100%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .hero-logo img:hover {
            transform: scale(1.02);
        }

        /* NAVIGAZIONE FISSA (STICKY) */
        nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--nav-bg);
            backdrop-filter: blur(10px); /* Sfoca ciò che ci passa sotto (supportato nei browser moderni) */
            padding: 1rem 2rem;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .nav-pill {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 0.6rem 1.5rem;
            border-radius: 25px;
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .nav-pill:hover {
            background-color: var(--accent);
            color: white;
            box-shadow: 0 4px 10px rgba(200, 88, 21, 0.2);
        }

        .container {
            max-width: 900px;
            margin: 3rem auto;
            padding: 0 1.5rem;
            min-height: 50vh;
        }
