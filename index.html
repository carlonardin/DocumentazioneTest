<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Documentazione - DeadlockGuild</title>
    
    <!-- Importazione Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:wght@800&display=swap" rel="stylesheet">
    
    <!-- Importazione FontAwesome per le icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #f8f9fa;
            --bg-section: #ffffff;
            --bg-bar: #e9ecef;
            --bg-bar-hover: #dee2e6;
            --text-main: #2b3035;
            --text-muted: #6c757d;
            --accent: #c85815; 
            --nav-bg: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Serve per spingere il footer in basso se c'è poco contenuto */
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
        }

        /* NAVIGAZIONE FISSA CON LOGO TESTUALE */
        nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background-color: var(--nav-bg);
            backdrop-filter: blur(10px);
            padding: 1rem 3rem;
            display: flex;
            justify-content: space-between; /* Logo a sinistra, link a destra */
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .nav-brand img {
            height: 50px; /* Logo testuale abbastanza grande */
            width: auto;
            transition: transform 0.2s;
        }
        
        .nav-brand img:hover {
            transform: scale(1.02);
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        .nav-pill {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            background-color: var(--bg-main);
            color: var(--text-main);
            padding: 0.6rem 1.5rem;
            border-radius: 25px;
            text-decoration: none;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }

        .nav-pill:hover {
            background-color: var(--accent);
            color: white;
            box-shadow: 0 4px 10px rgba(200, 88, 21, 0.2);
        }

        /* CONTENITORE PRINCIPALE */
        .container {
            max-width: 900px;
            margin: 3rem auto;
            padding: 0 1.5rem;
            flex: 1; /* Fa espandere il contenitore riempiendo lo spazio vuoto prima del footer */
            width: 100%;
            box-sizing: border-box;
        }

        /* SEZIONI */
        section {
            background-color: var(--bg-section);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            margin-bottom: 2.5rem;
            scroll-margin-top: 100px; 
        }

        h1 {
            color: var(--accent);
            font-size: 2.2rem;
            text-transform: uppercase;
            margin-top: 0;
            margin-bottom: 1.5rem;
            border-bottom: 3px solid var(--bg-main);
            padding-bottom: 0.8rem;
        }

        h2 {
            color: var(--accent);
            font-size: 1.5rem;
            margin-top: 2rem;
            margin-bottom: 1rem;
        }

        h3 {
            color: var(--text-main);
            font-size: 1.2rem;
            margin-top: 1.2rem;
            margin-bottom: 0.8rem;
        }

        /* BARRE DOCUMENTI */
        .doc-list {
            list-style: none;
            padding: 0;
            margin: 0 0 1.5rem 0;
        }

        .doc-list li {
            margin-bottom: 0.8rem;
            margin-left: 1rem;
        }

        .doc-bar {
            display: flex;
            align-items: center;
            background-color: var(--bg-main);
            padding: 1rem 1.2rem;
            border-radius: 6px;
            border-left: 6px solid var(--accent);
            text-decoration: none;
            color: var(--text-main);
            font-weight: bold;
            transition: all 0.2s;
        }

        .doc-bar:hover {
            background-color: var(--bg-bar-hover);
            transform: translateX(6px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .version {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: normal;
            margin-left: auto;
            font-family: monospace;
            background-color: var(--bg-section);
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
        }

        /* FOOTER RICCO CON CONTATTI */
        footer {
            background-color: #2b3035; /* Sfondo scuro per dare stacco e importanza */
            color: #ffffff;
            padding: 4rem 2rem 3rem 2rem;
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 1.5rem;
        }

        .footer-logo {
            height: 130px; /* Logo intero in grande */
            width: auto;
            margin-bottom: 1rem;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .footer-description {
            font-size: 1.1rem;
            color: #d1d5db;
            line-height: 1.8;
            max-width: 600px;
            margin: 0;
        }
