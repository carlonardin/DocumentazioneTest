name: Build Typst & Deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v3

      - name: Compila Typst in PDF
        run: |
          mkdir -p public
          
          # 1. Copia HTML e CSS dalla cartella website alla radice del server
          cp website/* public/
          
          # 2. Copia la cartella assets alla radice del server
          cp -r assets public/
          
          # 3. Trova i file .typ escludendo i template e compila
          find Candidatura -name "*.typ" ! -name "template.typ" -type f | while read -r file; do
            dir_path=$(dirname "$file")
            mkdir -p "public/pdf/$dir_path"
            
            echo "Compilazione di $file..."
            typst compile --root . "$file" "public/pdf/${file%.typ}.pdf"
          done

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
